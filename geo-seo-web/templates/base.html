<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}GEO-SEO Auditor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06060f;
      --bg2: #0c0c1a;
      --bg3: #121228;
      --surface: rgba(255,255,255,0.035);
      --surface-hover: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.07);
      --border-accent: rgba(0,229,160,0.25);
      --mint: #00e5a0;
      --mint-dim: rgba(0,229,160,0.15);
      --blue: #2196f3;
      --blue-dim: rgba(33,150,243,0.15);
      --yellow: #ffd166;
      --red: #ff4d6d;
      --text: #e8e8f0;
      --text-muted: rgba(232,232,240,0.45);
      --text-dim: rgba(232,232,240,0.25);
      --font-head: 'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
      --radius: 14px;
      --radius-sm: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Grid noise texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0,229,160,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(33,150,243,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Nav ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
      height: 60px;
      background: rgba(6,6,15,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--text);
      text-decoration: none;
      display: flex; align-items: center; gap: 0.5rem;
    }

    .nav-logo span { color: var(--mint); }

    .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .nav-links a {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }

    .badge-provider {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      border: 1px solid var(--border-accent);
      color: var(--mint);
      background: var(--mint-dim);
    }

    /* ── Layout ── */
    main {
      position: relative; z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
    }
    .card:hover { border-color: rgba(255,255,255,0.12); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.7rem 1.5rem;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--mint);
      color: #05100c;
    }
    .btn-primary:hover {
      background: #00ffc3;
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(0,229,160,0.3);
    }
    .btn-ghost {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface-hover); color: var(--text); }

    /* ── Inputs ── */
    input, select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      padding: 0.7rem 1rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--mint); }
    input::placeholder { color: var(--text-dim); }
    select option { background: var(--bg2); }

    label {
      display: block;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Score pill ── */
    .score-pill {
      display: inline-flex; align-items: center;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.78rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      gap: 0.3rem;
    }
    .score-excellent { background: rgba(0,229,160,0.15); color: var(--mint); border: 1px solid rgba(0,229,160,0.3); }
    .score-good      { background: rgba(33,150,243,0.15); color: #60c8ff; border: 1px solid rgba(33,150,243,0.3); }
    .score-fair      { background: rgba(255,209,102,0.15); color: var(--yellow); border: 1px solid rgba(255,209,102,0.3); }
    .score-poor      { background: rgba(255,120,60,0.15); color: #ff783c; border: 1px solid rgba(255,120,60,0.3); }
    .score-critical  { background: rgba(255,77,109,0.15); color: var(--red); border: 1px solid rgba(255,77,109,0.3); }

    /* ── Severity badges ── */
    .sev { font-size: 0.7rem; font-family: var(--font-mono); padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; }
    .sev-critical { background: rgba(255,77,109,0.2); color: #ff6b85; }
    .sev-high     { background: rgba(255,120,60,0.2); color: #ff9060; }
    .sev-medium   { background: rgba(255,209,102,0.2); color: #ffd166; }
    .sev-low      { background: rgba(33,150,243,0.2); color: #60c8ff; }

    /* ── Utilities ── */
    .text-mono { font-family: var(--font-mono); }
    .text-muted { color: var(--text-muted); }
    .text-mint { color: var(--mint); }
    .text-sm { font-size: 0.85rem; }
    .text-xs { font-size: 0.75rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
    .mt-4 { margin-top: 2rem; }

    @media (max-width: 640px) {
      .grid-2 { grid-template-columns: 1fr; }
      nav { padding: 0 1rem; }
      main { padding: 2rem 1rem 4rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">
      GEO<span>.</span>SEO
    </a>
    <div class="nav-links">
      <a href="/history">Histórico</a>
      <span class="badge-provider">Gemini · Perplexity</span>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
